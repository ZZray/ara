[workspace]
members = [
  "crates/ara-ai",
  "crates/ara-testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
ara-ai = { path = "crates/ara-ai" }
ara-agent = { path = "crates/ara-agent" }
ara-session = { path = "crates/ara-session" }
ara-tools = { path = "crates/ara-tools" }
ara-testkit = { path = "crates/ara-testkit" }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "v7"] }
