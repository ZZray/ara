# Dependency policy for `cargo deny check`. Reviewed 2026-09-25 for the
# initial ara-ai/ara-testkit dependency set; widen only with a recorded reason.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # Boost 1.0 (permissive, OSI-approved): `xxhash-rust`, which the vendored
  # OMP pi-edit/pi-ast crates use for hashline tags (xxh32) and parse caches.
  # Added 2026-09-25 with TOOLS-03.
  "BSL-1.0",
  # Zlib: permissive (OSI-approved). foldhash, via yaml-rust2 -> hashlink, the
  # YAML 1.2 parser for SKILL.md frontmatter. Added 2026-09-25 with CTX-01c.
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
