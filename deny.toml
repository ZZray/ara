# Dependency policy for `cargo deny check`. Reviewed 2026-09-25 for the
# initial ara-ai/ara-testkit dependency set; widen only with a recorded reason.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# User-approved 2026-10-30; see the Headroom policy decision in
# crates/ara-agent-lite-core/docs/evidence/lite-capability/headroom/dependency-policy-20261030.md.
# cargo-deny scopes this ignore by advisory ID, including all matching versions
# in the shared Full graph. This does not waive any other advisory.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "User approved the root advisory-ID exception on 2026-10-30 after evaluating fixed Headroom 17d38e5 and paste 1.0.15. This advisory reports unmaintained status, with no patched version. cargo-deny cannot version-scope this ignore; the approved scope includes other matching versions and the existing Full graph. Re-review when the dependency lock or integration route changes." }]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # Boost 1.0 (permissive, OSI-approved): `xxhash-rust`, which the vendored
  # ara-edit/ara-ast crates (OMP pi-edit/pi-ast) use for hashline tags (xxh32)
  # and parse caches.
  # Added 2026-09-25 with TOOLS-03.
  "BSL-1.0",
  # Zlib: permissive (OSI-approved). foldhash, via yaml-rust2 -> hashlink, the
  # YAML 1.2 parser for SKILL.md frontmatter. Added 2026-09-25 with CTX-01c.
  "Zlib",
]

# Fixed TUI static color parser dependencies; package/version-scoped MPL grants.
exceptions = [
  # Fixed Headroom H0 packages, user-approved 2026-10-30. Retain the MPL
  # notices and covered-source access; include the CDLA text with shared data.
  { name = "option-ext", version = "=0.2.0", allow = ["MPL-2.0"] },
  { name = "webpki-roots", version = "=1.0.11", allow = ["CDLA-Permissive-2.0"] },
  { name = "cssparser", version = "=0.37.0", allow = ["MPL-2.0"] },
  { name = "cssparser-color", version = "=0.5.0", allow = ["MPL-2.0"] },
  # PDF/SVG resvg dependency; retain the complete notice in distributions.
  { name = "arrayref", version = "=0.3.9", allow = ["BSD-2-Clause"] },
  # Fixed b91 gix-pack 0.72 -> uluru 3.1.0. Unmodified registry source;
  # source access and full MPL notice retained in THIRD_PARTY_NOTICES.md/LICENSE.uluru.
  { name = "uluru", version = "=3.1.0", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
