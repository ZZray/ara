[package]
name = "lite-consumer-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Out-of-tree consumer of the ARA Lite crates that uses only stable public items (requirement 31)"

# Not a member of any Lite workspace (requirement 31.1).
[workspace]

[dependencies]
ara-agent-lite-core = { path = "../../crates/ara-agent-lite-core" }
ara-agent-lite-harness = { path = "../../crates/ara-agent-lite-harness" }
ara-agent-lite-jsonl = { path = "../../crates/ara-agent-lite-jsonl" }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
