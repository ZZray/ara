[package]
name = "ara-lite-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Optional durable Host over ara-lite coordination and Lite Harness"

[workspace]

[dependencies]
ara-lite = { path = "../ara-lite" }
ara-agent-lite-harness = { path = "../../crates/ara-agent-lite-harness" }
anyhow = "1"
async-trait = "0.1"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
