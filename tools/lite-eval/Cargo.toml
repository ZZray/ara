[package]
name = "lite-eval"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Evaluation runner, capability test host and delivery gates for ARA Agent Lite"

# Standalone crate: deliberately NOT a member of the repository root workspace,
# and not part of the three Lite crates' dependency graphs (design DD-01).
[workspace]

[lib]
name = "lite_eval"
path = "src/lib.rs"

[[bin]]
name = "lite-eval"
path = "src/main.rs"

# Exact versions; registry crates reuse the versions locked by ara-agent-lite-harness.
[dependencies]
ara-agent-lite-harness = { path = "../../crates/ara-agent-lite-harness" }
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

# Hard-link counts for workspace isolation (GetFileInformationByHandle).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Verified in design-records.md DR-X-1.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
