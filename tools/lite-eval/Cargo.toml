[package]
name = "lite-eval"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Evaluation runner, capability test host and delivery gates for ARA Agent Lite"

# Standalone crate: deliberately NOT a member of the repository root workspace,
# and not part of the three Lite crates' dependency graphs (design DD-01).
[workspace]

[lib]
name = "lite_eval"
path = "src/lib.rs"

[[bin]]
name = "lite-eval"
path = "src/main.rs"

# Exact versions; registry crates reuse the versions locked by ara-agent-lite-harness.
[dependencies]
ara-agent-lite-harness = { path = "../../crates/ara-agent-lite-harness" }
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
# Runner, Capability_Test_Host and probe (tasks 11–13). All four are already in
# this crate's lock through ara-agent-lite-harness/-core; pinned to those versions.
async-trait = "=0.1.92"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }

# Hard-link counts for workspace isolation (GetFileInformationByHandle).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Verified in design-records.md DR-X-1.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"

[profile.dev]
# Line tables keep panic and backtrace line numbers; full debug info made
# each target dir several GB (mostly .pdb). Dependencies carry none.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
