# OMP source surface map for the pinned baseline.
#
# Every tracked file at `baseline_commit` must match exactly one surface (first
# matching rule wins, in file order). `scripts/omp_inventory.py` fails when a
# file is unassigned or a surface has no files. Upstream test cases found in a
# surface's test files become that surface's behavior items.
#
# scope:  core      shared Rust Agent Core (no product state)
#         provider  model wire/protocol adapter or catalog policy
#         host      host adapter or transport (CLI, RPC, ACP, MCP, LSP, DAP, SSH)
#         host-ui   interactive terminal/web presentation owned by a host/product
#         service   optional Agent capability behind an explicit port
#         native    existing OMP Rust crate or native binding
#         repo      build, CI, docs, benchmark or package metadata (no runtime port)
# gate:   roadmap gate that first needs the surface (P1, P2, P3); `repo` rows use "-".
# owner:  planned ARA Rust owner; "tbd" until the surface is taken up.
# status: open | implementing | tested | audited | accepted | intentional-difference
#         (surface status only advances when all of its behavior items do).

schema_version = 1

# ---------------------------------------------------------------- repo-wide
[[surface]]
id = "REPO-PKG-META"
title = "Package manifests, changelogs, READMEs, licenses, tsconfig"
scope = "repo"
gate = "-"
owner = "none"
status = "open"
match = [
  '^packages/[^/]+/(README\.md|CHANGELOG\.md|DEVELOPMENT\.md|LICENSE|package\.json|tsconfig[^/]*\.json|bunfig\.toml|\.gitignore|\.npmignore|BUILD\.bazel|biome\.json)$',
]
behavior = "Publishing metadata and release notes; CHANGELOG entries are read as behavior hints only."

