[package]
name = "ara-tools"
description = "ARA built-in tools: read, write, edit, bash, grep, glob (ported from OMP coding-agent tools)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
ara-agent.workspace = true
ara-ai.workspace = true
ara-rpc.workspace = true
ara-prompt.workspace = true
serde.workspace = true
rusqlite.workspace = true
json5 = "=1.3.1"
ara-walk.workspace = true
ast-grep-core.workspace = true
async-trait.workspace = true
base64 = "0.22"
bzip2 = "=0.6.1"
crc32fast = "=1.5.2"
encoding_rs = "=0.8.42"
flate2 = "=1.1.10"
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
zstd.workspace = true
futures.workspace = true
globset = "0.4"
grep-matcher = "0.1"
grep-pcre2 = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
icu_collator = "=2.3.1"
icu_locale_core = "=2.3.0"
libc = "0.2"
ara-edit.workspace = true
ara-ast.workspace = true
regex = "1"
serde_json.workspace = true
sys-locale = "=0.3.2"
tokio.workspace = true
tokio-util.workspace = true

uuid.workspace = true
pdf-inspector = "=1.17.0"
resvg = "=0.48.1"

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Fixed upstream zune-jpeg no-log stub macro compatibility.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["log"] }
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
