[package]
name = "ara-agent-lite-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Host-reviewed bounded tasks over ARA Agent Lite"

[workspace]

[dependencies]
ara-agent-lite-core = { path = "../ara-agent-lite-core" }
anyhow = "1"
async-trait = "0.1"
fs2 = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = "3"
