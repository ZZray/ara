[package]
name = "ara-cli"
description = "ARA reference host: print-mode CLI binding the agent core to a model route, tools and a session journal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-fixture = []

[[bin]]
name = "ara"
path = "src/main.rs"

[[bin]]
name = "ara-mcp-fixture"
path = "tests/support/fake_mcp.rs"
required-features = ["test-fixture"]

[[test]]
name = "mcp_stdio"
path = "tests/mcp_stdio.rs"
required-features = ["test-fixture"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
brotli = "9"
ara-agent.workspace = true
ara-mcp.workspace = true
ara-ai.workspace = true
ara-context.workspace = true
ara-prompt.workspace = true
ara-rpc.workspace = true
ara-discovery.workspace = true
ara-session.workspace = true
ara-snapcompact.workspace = true
ara-tools.workspace = true
ara-edit.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
flate2 = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "native-tokio"] }
icu_collator = "=2.3.1"
icu_locale_core = "=2.3.0"
num-bigint = "0.4"
num-traits = "0.2"
reqwest.workspace = true
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
regex.workspace = true
regress.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
sys-locale = "=0.3.2"
uuid.workspace = true
yaml-rust2.workspace = true
zstd.workspace = true

[dev-dependencies]
ara-testkit.workspace = true
ring.workspace = true
libc = "0.2"
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
