name: CTX-01d Skill directory I/O faults

on:
  push:
    branches: [dev]
    paths:
      - scripts/ctx_skill_directory_fault.c
      - scripts/ctx_skill_directory_fault_trial.py
      - .github/workflows/ctx-skill-directory-fault.yml
      - crates/ara-tools/src/read.rs
      - crates/ara-cli/src/main.rs
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-gnu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reviewed exact Rust toolchain and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ctx-directory-fault"
          rustup toolchain install 1.97.1 --profile minimal --component rust-src 2>&1 | tee "$RUNNER_TEMP/ctx-directory-fault/toolchain.log"
          rustc -vV | tee "$RUNNER_TEMP/ctx-directory-fault/rustc.txt"
          test "$(rustc -vV | sed -n 's/^commit-hash: //p')" = '8bab26f4f68e0e26f0bb7960be334d5b520ea452'
      - name: Build unchanged Rust CLI and test shim
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p ara-cli --bin ara 2>&1 | tee "$RUNNER_TEMP/ctx-directory-fault/build.log"
          cc -std=gnu11 -D_GNU_SOURCE -shared -fPIC -O2 \
            -Wall -Wextra -Werror -pthread -Wl,-z,defs -Wl,-z,now \
            scripts/ctx_skill_directory_fault.c \
            -o "$RUNNER_TEMP/ctx-directory-fault/libctx_dir_fault.so" -ldl \
            2>&1 | tee "$RUNNER_TEMP/ctx-directory-fault/shim-build.log"
      - name: Probe GNU ABI and execute actual CLI control and faults
        shell: bash
        run: |
          set -euo pipefail
          std_source="$(rustc --print sysroot)/lib/rustlib/src/rust/library/std/src/sys/fs/unix.rs"
          mapfile -t tokio_sources < <(find "$HOME/.cargo/registry/src" -path '*/tokio-1.53.1/src/fs/read_dir.rs' -type f)
          test "${#tokio_sources[@]}" = 1
          python scripts/ctx_skill_directory_fault_trial.py \
            --binary "$GITHUB_WORKSPACE/target/debug/ara" \
            --shim "$RUNNER_TEMP/ctx-directory-fault/libctx_dir_fault.so" \
            --output "$RUNNER_TEMP/ctx-directory-fault" \
            --std-source "$std_source" \
            --tokio-source "${tokio_sources[0]}" \
            2>&1 | tee "$RUNNER_TEMP/ctx-directory-fault/trial.log"
      - name: Preserve trial and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctx-skill-directory-fault-linux-gnu
          path: ${{ runner.temp }}/ctx-directory-fault/
          if-no-files-found: error
          include-hidden-files: true
